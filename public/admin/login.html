<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=/login.html" />
  <title>Sign In — Driver-Fatigue Detection</title>
  <script>window.location.replace('/login.html');</script>
</head>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      text-align: center;
    }

    .login-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .login-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .demo-credentials {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .demo-credentials code {
      font-family: var(--font-mono);
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-brand">
    <div class="login-logo" aria-hidden="true">🛡️</div>
    <h1 class="login-title">Driver-Fatigue Detection</h1>
    <p class="login-desc">Enterprise Safety Intelligence Portal</p>
  </div>

  <div class="card">
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-input" placeholder="admin@drowsyguard.io" required autofocus autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
        Sign In to Portal
      </button>
    </form>

    <div class="demo-credentials">
      <strong>Demo Accounts:</strong><br />
      Admin: <code>admin@drowsyguard.io</code> / <code>admin123</code><br />
      Manager: <code>manager@drowsyguard.io</code> / <code>manager123</code>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
  // Route check: if already logged in, redirect
  const token = localStorage.getItem('drowsyguard_token');
  if (token) {
    window.location.replace('/admin');
  }

  function showToast(message, type = 'error') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Authenticating…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Login failed');
      }

      localStorage.setItem('drowsyguard_token', data.token);
      localStorage.setItem('drowsyguard_user', JSON.stringify(data.user));
      window.location.replace('/admin');
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In to Portal';
    }
  });
</script>

</body>
</html>
